# drive-sort Regeln — deklarativ, erste passende Regel gewinnt.
# Ändert nur was hier steht. Sicherheit > Vollständigkeit.

remote: "gdrive:"

# NIEMALS anfassen — System-/DR-/Secret-Ordner (bisync-Set, WD-60-Territorium)
# und die neuen Buckets selbst (sonst Re-Sortier-Schleife).
protected:
  - cortex
  - prompts
  - secrets
  - claude-system
  - claude-config
  - basic-memory
  - knowledge-base
  - hooks
  - repos
  - SYSTEM31
  - Smarthome
  - PC1
  - PC2
  - Laptop
  - DriveSyncFiles
  - Backup
  - Backups
  - DriveSyncFiles
  - Notfälle

buckets:
  - "00_Inbox"
  - "10_Buerokratie"
  - "20_Finanzen"
  - "30_Karriere"
  - "40_Projekte"
  - "50_Medien"
  - "90_Archiv"
  - "99_Review"

# Quarantäne-Ziel für Müll. Datum wird angehängt: 99_Review/2026-05-18/
quarantine: "99_Review"

# Lose Dateien im gdrive-Root → klassifizieren. Erste Regel die matcht gewinnt.
# Matcher: ext (Endung, lowercase) | name_re (Regex auf Dateiname) |
#          empty_gdoc (Size==-1, also Google-natives/leeres Doc) | any
file_rules:
  - {name: empty_gdoc_junk,  empty_gdoc: true, name_re: "(?i)(unbenannt|untitled|^mary$)", target: "99_Review"}
  - {name: dup_suffix,       name_re: ".* 2\\.[A-Za-z0-9]+$",                              target: "99_Review"}
  - {name: shape_screenshots, ext: [png], name_re: "(?i)(capture|^cross|ninja|octa|square|triangle|^water|^[0-9]+\\.png$|frisur)", target: "99_Review"}
  - {name: media,            ext: [mp4, mov, jpg, jpeg, png, ogg, gif, heic], target: "50_Medien"}
  - {name: ideen_docx,       name_re: "(?i)^projekt:",                        target: "40_Projekte"}
  - {name: schulung_pdf,     name_re: "(?i)(schulung|redux)",                 target: "40_Projekte"}
  - {name: docs,             ext: [md, pdf, docx, doc, txt, json, ogg],       target: "00_Inbox"}
  - {name: fallback,         any: true,                                       target: "00_Inbox"}

# Ganze bestehende Root-Ordner in die neue Taxonomie konsolidieren.
# KOPPLUNG: "Bürokratie" → news-poll liest gdrive:Bürokratie. Bei Apply MUSS
# NEWS_BUERO_REMOTE in ~/cortex/main.py auf gdrive:10_Buerokratie/Bürokratie
# mitgezogen werden. Steht als harter Punkt in der Task.
folder_moves:
  "Bürokratie": "10_Buerokratie"
  "Wertpapiere": "20_Finanzen"
  "Bewerbungen": "30_Karriere"
  "Personalien und Daten": "30_Karriere"
  "DJ & Producing": "40_Projekte"
  "Uni": "40_Projekte"
  "Wawi": "40_Projekte"
  "Camera": "50_Medien"
  "Sticker": "50_Medien"
  "USB-Musik-Backup": "50_Medien"
  "Vorlagen": "40_Projekte"
  "Layer 30.5.2023": "90_Archiv"
  "abstashen": "90_Archiv"
  "Onedrive and Dropbox": "90_Archiv"
  "Docs": "00_Inbox"
  "PDF": "00_Inbox"
  "Installers": "90_Archiv"

# Ordner deren lose Top-Level-Dateien auf " 2.<ext>"/Doppel dedupliziert
# werden (→ Quarantäne). Ordnerstruktur bleibt unangetastet.
dedupe_dirs:
  - "OneXip"
